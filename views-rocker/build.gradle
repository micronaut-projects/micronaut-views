plugins {
    id "io.micronaut.build.internal.views-module"
    id 'nu.studer.rocker' version '3.3.1'
}

rocker {
    configurations {
        test {
            templateDir = file('src/test/resources')
            outputDir = file('build/generated/rocker')
            optimize = true
        }
    }
}

dependencies {
    annotationProcessor(mnValidation.micronaut.validation.processor)

    api projects.micronautViewsCore
    api(libs.managed.rocker.runtime)
    compileOnly(libs.rocker.compiler) {
        because("Compiles the templates of the views source roots in development mode, when the application adds it")
    }
    compileOnly(mn.micronaut.management)
    compileOnly(mnValidation.micronaut.validation)

    testCompileOnly(mn.micronaut.inject.groovy)
    testAnnotationProcessor(mnValidation.micronaut.validation.processor)
    testAnnotationProcessor(mn.micronaut.inject.java)

    testImplementation(mnSerde.micronaut.serde.jackson)
    testImplementation(mn.reactor)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.management)
    testImplementation(mnValidation.micronaut.validation)
    testImplementation(mn.snakeyaml)

    testImplementation(libs.rocker.compiler)
    // the launcher test starts a tiny application through micronaut-dev, compiling it with the processor on the test classpath
    testImplementation(mn.micronaut.dev.tck)
    testImplementation(mn.micronaut.inject.java)
    testImplementation(mnTest.junit.jupiter.api)
    testImplementation(mnTest.micronaut.test.junit5)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
}
